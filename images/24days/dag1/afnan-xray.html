<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afnan Water Factory – X-ray</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0a07; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg { display: block; width: 100vw; height: 100vh; }
  #sat, #dark, #oil { transition: opacity .8s ease; }
  #dark, #oil { opacity: 0; }
  body.xray #sat { opacity: .28; }
  body.xray #dark { opacity: .72; }
  body.xray #oil { opacity: 1; }
  #oil .core { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-opacity: .55; } }
  button {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 14px 30px; border: 0; border-radius: 999px; cursor: pointer;
    font: 600 16px/1 inherit; letter-spacing: .08em; color: #fff;
    background: rgba(20,20,20,.75); backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.18);
    transition: background .3s, box-shadow .3s;
  }
  body.xray button { background: #e8650f; box-shadow: 0 0 28px rgba(255,120,20,.7), inset 0 0 0 1px rgba(255,255,255,.3); }
  .credit { position: fixed; right: 8px; bottom: 6px; font-size: 10px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<svg id="map" viewBox="9 71 1654 1665" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="crude" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2a1404"/><stop offset=".7" stop-color="#0c0602"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>
  <g id="sat"></g>
  <rect id="dark" x="0" y="0" width="1792" height="1792" fill="#120b05"/>
  <g id="oil"></g>
</svg>
<button id="toggle" aria-pressed="false">X-RAY OFF</button>
<div class="credit">Imagery: Esri, Maxar, Earthstar Geographics · oil pockets are illustrative</div>

<script>
// Satellite tiles (Esri World Imagery, zoom 18) around the Afnan water factory
const Z = 18, TX0 = 165431, TY0 = 112789, N = 7;
const NS = "http://www.w3.org/2000/svg";
const sat = document.getElementById("sat");
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  const im = document.createElementNS(NS, "image");
  im.setAttribute("href", `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${Z}/${TY0 + j}/${TX0 + i}`);
  im.setAttribute("x", i * 256); im.setAttribute("y", j * 256);
  im.setAttribute("width", 256.6); im.setAttribute("height", 256.6);
  sat.appendChild(im);
}

// Crude-oil pockets (same positions as the Blender model), in tile-pixel coordinates
const big = [
  "665,794 712,753 727,746 741,739 758,737 790,737 806,739 837,749 848,759 860,770 870,783 883,824 863,863 845,888 819,903 790,915 773,918 739,914 702,909 687,879 666,839",
  "1149,1445 1151,1409 1162,1378 1201,1339 1224,1331 1234,1336 1275,1369 1293,1391 1301,1425 1287,1493 1278,1526 1245,1545 1201,1549 1188,1549 1179,1538 1160,1514 1152,1498 1151,1481",
  "973,750 979,723 982,709 986,696 990,683 1016,650 1061,661 1079,671 1091,678 1110,719 1116,750 1111,765 1087,815 1065,854 1040,855 982,807 973,780",
  "674,983 687,950 718,896 729,881 854,901 883,921 896,952 896,1000 889,1030 879,1043 867,1054 822,1078 788,1086 699,1042 675,999",
  "1368,232 1378,207 1407,190 1430,184 1495,169 1512,169 1532,172 1581,189 1606,210 1623,231 1605,279 1582,299 1563,307 1511,314 1455,319 1414,312 1372,255",
  "569,442 572,425 576,410 598,359 639,343 661,339 726,328 751,331 832,371 855,423 871,464 797,541 751,552 704,553 681,551 608,516 591,506 575,475",
  "1353,1080 1360,1041 1374,995 1383,982 1407,959 1421,949 1516,918 1537,924 1558,932 1565,957 1589,1059 1592,1076 1581,1092 1572,1107 1560,1120 1546,1134 1531,1143 1491,1146 1379,1124 1362,1113",
  "1103,1413 1115,1376 1121,1367 1142,1358 1166,1348 1178,1347 1189,1350 1241,1375 1251,1382 1251,1404 1249,1422 1244,1441 1231,1458 1216,1474 1205,1481 1178,1479 1128,1455 1118,1449 1109,1442 1105,1432 1104,1423",
  "300,607 307,574 311,563 333,545 385,526 488,530 504,538 516,546 527,556 546,584 539,605 528,634 514,642 444,658 427,656 341,641 309,628"
].map(s => s.split(" ").map(p => p.split(",").map(Number)));
const small = [[1281,1194,16],[413,1261,19],[1446,1123,27],[1020,1078,24],[672,555,23],[809,1303,23],
  [985,1093,28],[1436,432,22],[989,1022,22],[979,1210,20],[512,287,17],[943,1450,30],[150,1618,28],[569,166,24]];

// smooth closed path through points (Catmull-Rom -> Bezier)
function smooth(pts) {
  const n = pts.length, P = i => pts[(i + n) % n];
  let d = `M${P(0)}`;
  for (let i = 0; i < n; i++) {
    const [p0, p1, p2, p3] = [P(i - 1), P(i), P(i + 1), P(i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1} ${c2} ${p2}`;
  }
  return d + "Z";
}
function circle(cx, cy, r) {
  const pts = [];
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2, w = r * (0.92 + 0.12 * Math.sin(k * 1.7 + cx));
    pts.push([cx + Math.cos(a) * w, cy + Math.sin(a) * w * 0.8]); }
  return pts;
}
const oil = document.getElementById("oil");
for (const pts of [...big, ...small.map(s => circle(...s))]) {
  const d = smooth(pts);
  const halo = document.createElementNS(NS, "path");
  halo.setAttribute("d", d); halo.setAttribute("fill", "#ff7a14"); halo.setAttribute("opacity", ".55"); halo.setAttribute("filter", "url(#glow)");
  const core = document.createElementNS(NS, "path");
  core.setAttribute("d", d); core.setAttribute("class", "core"); core.setAttribute("fill", "url(#crude)");
  core.setAttribute("stroke", "#ffa040"); core.setAttribute("stroke-width", "3");
  oil.append(halo, core);
}

// the toggle
const btn = document.getElementById("toggle");
function toggle() {
  const on = document.body.classList.toggle("xray");
  btn.textContent = on ? "X-RAY ON" : "X-RAY OFF";
  btn.setAttribute("aria-pressed", on);
}
btn.addEventListener("click", toggle);
addEventListener("keydown", e => { if (e.key.toLowerCase() === "x") toggle(); });
</script>
</body>
</html>
