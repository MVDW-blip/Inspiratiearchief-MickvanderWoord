<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEEST</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  body.idle,body.idle #gl{cursor:none}
  #raster{position:fixed;left:0;right:0;bottom:12px;width:100%;height:58px;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    font:12px/1.8 ui-monospace,Menlo,Consolas,monospace;padding:40px;color:#e9dfe2}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="raster"></canvas>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   BEEST — neurons imagined as creatures in an endless white dish.

   The camera is fixed: you look through the glass of the dish at eye
   level. The beests wander, watch you, and walk right up to the screen.

   Stimulation follows the DishBrain / CL1 "Pong" protocol
   (Kagan et al., Neuron 2022):
     SPACE  = a "miss": UNPREDICTABLE feedback — 150 mV pulses on random
              input electrodes at random times (~5 Hz) for 4 seconds,
              then rest. Hold SPACE to keep it going.
     P      = a "hit": PREDICTABLE feedback — 75 mV, 100 Hz for 100 ms
              on all 8 input electrodes at once.
     M      = sound on/off
   Each pulse evokes spikes in the units close to the stimulated
   electrode within milliseconds; the activity then spreads through the
   network. The spike raster at the bottom is the recording: one row per
   unit, a vertical tick for every stimulation pulse.
   ===================================================================== */

const Q = new URLSearchParams(location.search);
const N = Math.max(1, Math.min(96, parseInt(Q.get('n')) || 32));

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  const el = document.getElementById('err');
  el.style.display = 'flex';
  el.textContent = 'This needs WebGL2. Try a recent Chrome, Edge, Firefox or Safari.';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.042);       // the endless black

const pmrem = new THREE.PMREMGenerator(renderer);
// a soft studio inside the white: grey surround + a few bright softboxes = wet, slimy highlights
scene.environment = (() => {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `varying vec3 vP; void main(){ float h = normalize(vP).y;
      vec3 c = h > 0.0 ? mix(vec3(0.36,0.33,0.34), vec3(0.75,0.73,0.74), h) : mix(vec3(0.36,0.33,0.34), vec3(0.52,0.44,0.47), -h);
      gl_FragColor = vec4(c, 1.0); }`,
  })));
  const box = (w, h, x, y, z, e) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(e, e, e), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  box(5, 2.6, -4.5, 6, 4.5, 9);     // key softbox
  box(1.6, 6, 6.5, 1.5, 2.5, 5);    // strip
  box(7, 1.4, 0, 3.5, -7.5, 4);     // back rim
  box(9, 9, 0, 9.6, 0, 2.4);        // ceiling
  return pmrem.fromScene(s, 0.015).texture;
})();
scene.environmentIntensity = 0.8;

// ---------------------------------------------------------------- the fixed view (the glass of the dish)
const EYE = new THREE.Vector3(0, 1.32, 0);   // eye level of the beests
const GLASS = 0.62;                          // closest a beest's body can get to the screen
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.02, 220);
camera.position.copy(EYE);
camera.lookAt(0, 0.9, -12);

const key = new THREE.DirectionalLight(0xfff6f4, 2.4);
key.position.set(-5, 11, 2);
key.target.position.set(0, 0, -9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 44 });
key.shadow.radius = 3.5;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.025;
scene.add(key, key.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0xf2d2da, 0.3));

// ---------------------------------------------------------------- the beest geometry (embedded)
const INFO = JSON.parse(document.getElementById('beest-info').textContent);
const geo = (() => {
  const raw = atob(document.getElementById('beest-data').textContent.trim());
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const nv = INFO.nv, nt = INFO.nt;
  const q = new Uint16Array(bytes.buffer, 0, nv * 3);
  const index = new Uint16Array(bytes.buffer, nv * 6, nt * 3);
  const tag = new Uint8Array(bytes.buffer, nv * 6 + nt * 6, nv);
  const pos = new Float32Array(nv * 3);
  for (let i = 0; i < nv * 3; i++) {
    const k = i % 3;
    pos[i] = INFO.bmin[k] + (q[i] / 65535) * (INFO.bmax[k] - INFO.bmin[k]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aTag', new THREE.BufferAttribute(Float32Array.from(tag), 1)); // part*4 + leg
  g.setIndex(new THREE.BufferAttribute(index, 1));
  g.computeVertexNormals();
  return g;
})();

// skeleton landmarks (model is 1.7 tall, faces +Z, feet at y = 0)
const HIP_Y = 0.68, NECK = new THREE.Vector3(-0.01, 1.09, -0.02), ANTLER_Y = 1.38;
// Each side of the beest is two overlapping leg pieces. They share one hip and one knee
// pivot and move exactly in phase, so a side always reads as one solid leg.
const sideOf = l => (l.foot[0] > 0 ? 1 : -1);
const legHip = [], legKnee = [], legPhase = [];
for (const l of INFO.legs) {
  const mates = INFO.legs.filter(m => sideOf(m) === sideOf(l));
  const avg = f => mates.reduce((a, m) => a.add(f(m)), new THREE.Vector3()).multiplyScalar(1 / mates.length);
  const top = avg(m => new THREE.Vector3(...m.top));
  legHip.push(new THREE.Vector3(top.x, HIP_Y, top.z));
  legKnee.push(avg(m => new THREE.Vector3(...m.top).lerp(new THREE.Vector3(...m.foot), 0.5)));
  legPhase.push(sideOf(l) > 0 ? 0 : Math.PI);
}
const eyes = INFO.eyes.map(e => new THREE.Vector3(...e));

// ---------------------------------------------------------------- per-instance data
const A = name => {
  const a = new THREE.InstancedBufferAttribute(new Float32Array(N * 4), 4);
  a.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute(name, a);
  return a;
};
const iGait = A('iGait');   // phase, legAmp, kneeAmp, torsoSquash
const iLook = A('iLook');   // headYaw, headPitch, antlerWobX, antlerWobZ
const iBody = A('iBody');   // lean, roll, eyeWide, blink(1 open)
const iState = A('iState'); // stress, fire, seed, hue
const iFx = A('iFx');       // electric zap, head tilt, -, -

const U = {
  uTime: { value: 0 },
  uLegHip: { value: legHip },
  uLegKnee: { value: legKnee },
  uLegPhase: { value: legPhase },
  uEye: { value: eyes },
  uNeck: { value: NECK },
  uHipY: { value: HIP_Y },
  uAntlerY: { value: ANTLER_Y },
  uSkin: { value: new THREE.Color('#f2cdd5') },
  uSkin2: { value: new THREE.Color('#fbe9ec') },
  uGroove: { value: new THREE.Color('#d8a1b0') },
  uFlush: { value: new THREE.Color('#ff3d64') },
  uGlow: { value: new THREE.Color('#ffd3dd') },
  uZapCol: { value: new THREE.Color(0.22, 0.55, 1.0) },
  uBump: { value: 0.0025 },
};

// ---------------------------------------------------------------- shaders
const NOISE = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 nm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;
  vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

// procedural rig: legs walk, knees bend, torso springs, head turns to the camera
const DEFORM = /* glsl */`
uniform float uTime;
uniform vec3 uLegHip[4];
uniform vec3 uLegKnee[4];
uniform float uLegPhase[4];
uniform vec3 uEye[2];
uniform vec3 uNeck;
uniform float uHipY;
uniform float uAntlerY;
attribute float aTag;
attribute vec4 iGait;
attribute vec4 iLook;
attribute vec4 iBody;
attribute vec4 iState;
attribute vec4 iFx;
varying vec3 vRest;
varying float vPart;
varying vec4 vState;
varying float vZap;
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.,-s,c,0.,0.,0.,1.);}
void beestDeform(inout vec3 p, inout vec3 n){
  vec3 r = p;
  float part = floor(aTag/4.0 + 0.01);
  float legi = aTag - part*4.0;
  bool isLeg = part > 1.5 && part < 2.5;
  bool isEye = part > 2.5;
  bool isAntler = part > 0.5 && part < 1.5;
  float t = uTime + iState.z*17.0;
  if (isLeg) {
    int li = int(legi + 0.5);
    vec3 hp = uLegHip[li], kp = uLegKnee[li];
    float ph = iGait.x + uLegPhase[li];
    float hip = -iGait.y * sin(ph);
    float knee = iGait.z * (0.1 + 0.9*max(0.0, cos(ph)));
    float wk = 1.0 - smoothstep(kp.y - 0.08, kp.y + 0.08, r.y);
    mat3 Rk = rotX(knee*wk);
    p = kp + Rk*(p - kp); n = Rk*n;
    float wh = 1.0 - smoothstep(uHipY - 0.03, uHipY + 0.06, r.y);
    mat3 Rh = rotX(hip*wh);
    p = hp + Rh*(p - hp); n = Rh*n;
  } else {
    if (isEye) {                         // wide with fear, blinking
      vec3 c = r.x > (uEye[0].x + uEye[1].x)*0.5 ? uEye[0] : uEye[1];
      vec3 d = (p - c) * (1.0 + 0.55*iBody.z);
      d.y *= max(iBody.w, 0.07);
      p = c + d;
    }
    if (isAntler) {                      // jelly antlers lag behind
      float wa = smoothstep(uAntlerY, uAntlerY + 0.33, r.y); wa *= wa;
      vec3 ab = vec3(0.0, uAntlerY, -0.02);
      mat3 Ra = rotZ(iLook.w*wa) * rotX(iLook.z*wa);
      p = ab + Ra*(p - ab); n = Ra*n;
    }
    // the stare: head yaw/pitch/tilt about the neck, part of the yaw twists the torso
    float wH = smoothstep(uNeck.y - 0.05, uNeck.y + 0.035, r.y);
    float wT = smoothstep(uHipY + 0.04, uNeck.y, r.y);
    float yaw = iLook.x * mix(0.28*wT, 1.0, wH);
    mat3 Rl = rotY(yaw) * rotX(iLook.y*wH) * rotZ(iFx.y*wH);
    p = uNeck + Rl*(p - uNeck); n = Rl*n;
    // zigzag torso works like a spring
    if (r.y > uHipY) {
      float u = clamp((r.y - uHipY)/(uNeck.y - uHipY), 0.0, 1.0);
      p.y -= (min(r.y, uNeck.y) - uHipY) * iGait.w;
      p.x *= 1.0 + iGait.w*1.5*sin(3.14159*u);
    }
    // upper body lean / roll from the hips
    float wB = smoothstep(uHipY - 0.1, uHipY + 0.3, r.y);
    mat3 Rb = rotZ(iBody.y*wB) * rotX(iBody.x*wB);
    vec3 H = vec3(0.0, uHipY, -0.015);
    p = H + Rb*(p - H); n = Rb*n;
  }
  if (!isEye) {                          // slime: always slightly moving, swells when it fires
    float w = sin(t*2.1 + r.y*15.0 + r.x*7.0) * sin(t*1.63 - r.z*13.0 + r.y*6.0);
    p += n * ((0.0022 + 0.006*iState.x)*w + 0.0045*iState.y + 0.004*iFx.x);
  }
  vRest = r; vPart = part; vState = iState; vZap = iFx.x;
}
`;

const SKIN_PARS = /* glsl */`
uniform vec3 uSkin; uniform vec3 uSkin2; uniform vec3 uGroove; uniform vec3 uFlush; uniform vec3 uGlow; uniform vec3 uZapCol;
uniform float uBump;
varying vec3 vRest; varying float vPart; varying vec4 vState; varying float vZap;
float bSulcus; float bHeight; float bEye; float bDetail; vec2 bdH;
${NOISE}
vec3 perturbN(vec3 sp, vec3 sn, vec2 dHdxy, float fd){
  vec3 sx = dFdx(sp), sy = dFdy(sp);
  vec3 R1 = cross(sy, sn), R2 = cross(sn, sx);
  float det = dot(sx, R1) * fd;
  vec3 grad = sign(det) * (dHdxy.x*R1 + dHdxy.y*R2);
  return normalize(abs(det)*sn - grad);
}
`;

const SKIN_COLOR = /* glsl */`
#include <color_fragment>
bEye = step(2.5, vPart);
{
  vec3 bp = vRest*15.0 + vState.z*31.0;
  vec3 wq = bp + 1.1*vec3(snoise(bp*0.38 + 3.1), snoise(bp*0.38 + 7.7), snoise(bp*0.38 + 1.3));
  float nn = abs(snoise(wq));
  bDetail = 1.0 - smoothstep(0.07, 0.3, length(fwidth(bp)));            // fade folds out with distance
  bSulcus = (1.0 - smoothstep(0.0, 0.16 + fwidth(nn)*1.5, nn)) * bDetail; // narrow meandering grooves
  float crown = mix(0.7, pow(smoothstep(0.0, 0.5, nn), 0.65), bDetail);  // rounded gyri between them
  float hx = mix(0.7, pow(smoothstep(0.0, 0.5, abs(snoise(wq + dFdx(wq)))), 0.65), bDetail);
  float hy = mix(0.7, pow(smoothstep(0.0, 0.5, abs(snoise(wq + dFdy(wq)))), 0.65), bDetail);
  bHeight = crown;
  bdH = vec2(hx - crown, hy - crown) * uBump * (1.0 - bEye);
  float blot = snoise(vRest*4.5 + vState.z*9.0)*0.5 + 0.5;
  vec3 skin = mix(uSkin, uSkin2, blot*0.8);
  skin *= 1.0 + vState.w*vec3(0.05, -0.06, 0.02);
  skin = mix(skin, uFlush, clamp(vState.x*0.78, 0.0, 1.0));
  vec3 col = mix(skin, uGroove * (1.0 + vState.x*0.4), bSulcus*0.3);   // folds only faintly visible
  col *= 0.96 + 0.04*crown;
  diffuseColor.rgb = mix(col, vec3(0.004, 0.003, 0.004), bEye);
  diffuseColor.a = mix(0.84, 1.0, bEye);                                 // milky, translucent body
}
`;
const SKIN_ROUGH = /* glsl */`
#include <roughnessmap_fragment>
roughnessFactor = mix(clamp(roughnessFactor*(1.0 - 0.3*bSulcus) - vState.x*0.12, 0.08, 1.0), 0.05, bEye);
`;
const SKIN_NORMAL = /* glsl */`
#include <normal_fragment_maps>
normal = perturbN(-vViewPosition, normal, bdH, faceDirection);
`;
const SKIN_CC_NORMAL = /* glsl */`
#include <clearcoat_normal_fragment_maps>
#ifdef USE_CLEARCOAT
clearcoatNormal = perturbN(-vViewPosition, clearcoatNormal, bdH*0.35, faceDirection);
#endif
`;
const SKIN_EMISSIVE = /* glsl */`
#include <emissivemap_fragment>
{
  float fr = pow(1.0 - clamp(abs(dot(normal, normalize(vViewPosition))), 0.0, 1.0), 2.4);
  totalEmissiveRadiance += uGlow * (fr*(0.12 + 0.38*vState.x) + vState.y*0.26) * (1.0 - bEye);
  // electrical stimulation: current lights up the folds for a few milliseconds
  totalEmissiveRadiance += uZapCol * vZap * mix(0.8, 0.22 + 2.3*bSulcus, bDetail) * (1.0 - bEye);
}
`;

const skinMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.6, metalness: 0,
  // milky translucent pink: the body is slightly see-through (alpha set in SKIN_COLOR), the eyes stay solid
  transparent: true, depthWrite: false,
  clearcoat: 0.45, clearcoatRoughness: 0.3,
  sheen: 0.3, sheenColor: new THREE.Color('#ffb3c6'), sheenRoughness: 0.4,
});
skinMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\n' + DEFORM)
    .replace('#include <beginnormal_vertex>',
      'vec3 objectNormal = vec3(normal);\nvec3 bPos = position;\nbeestDeform(bPos, objectNormal);')
    .replace('#include <begin_vertex>', 'vec3 transformed = bPos;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\n' + SKIN_PARS)
    .replace('#include <color_fragment>', SKIN_COLOR)
    .replace('#include <roughnessmap_fragment>', SKIN_ROUGH)
    .replace('#include <normal_fragment_maps>', SKIN_NORMAL)
    .replace('#include <clearcoat_normal_fragment_maps>', SKIN_CC_NORMAL)
    .replace('#include <emissivemap_fragment>', SKIN_EMISSIVE);
};
skinMat.customProgramCacheKey = () => 'beest-skin-milk';

const depthMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
depthMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\n' + DEFORM)
    .replace('#include <begin_vertex>', 'vec3 transformed = position; vec3 bN = normal; beestDeform(transformed, bN);');
};
depthMat.customProgramCacheKey = () => 'beest-depth-v2';

const herd = new THREE.InstancedMesh(geo, skinMat, N);
herd.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
herd.customDepthMaterial = depthMat;
herd.castShadow = true;
herd.receiveShadow = true;
herd.frustumCulled = false;
scene.add(herd);

// ---------------------------------------------------------------- floor: nothing but soft shadows
const FU = { uCre: { value: Array.from({ length: N }, () => new THREE.Vector4()) } };
const floorMat = new THREE.ShadowMaterial({ transparent: true, depthWrite: false });
floorMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, FU);
  sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('void main() {', `#define NCRE ${N}\nuniform vec4 uCre[NCRE];\nvarying vec3 vWPos;\nvoid main() {`)
    .replace('gl_FragColor = vec4( color, opacity * ( 1.0 - getShadowMask() ) );', /* glsl */`
  float ao = 0.0;
  for (int i = 0; i < NCRE; i++) {
    vec2 dp = vWPos.xz - uCre[i].xy;
    float d2 = dot(dp, dp);
    if (d2 > 1.2) continue;
    ao += exp(-d2 * 10.0) * (1.0 - clamp(uCre[i].w*1.6, 0.0, 0.85));
  }
  gl_FragColor = vec4(vec3(0.0), clamp((1.0 - getShadowMask())*0.26 + ao*0.16, 0.0, 0.7));`);
};
floorMat.customProgramCacheKey = () => 'beest-floor-v2-' + N;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(460, 460), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
floor.renderOrder = -1;
scene.add(floor);

// ---------------------------------------------------------------- slime droplets
const MAXD = 180;
const dropMat = new THREE.MeshPhysicalMaterial({ color: '#ff7f9c', roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 });
const drops = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), dropMat, MAXD);
drops.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
drops.frustumCulled = false;
scene.add(drops);
const D = Array.from({ length: MAXD }, () => ({ alive: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, r: 0, life: 0, splat: 0 }));
let dropCursor = 0;
function spawnDrop(x, y, z, power) {
  const d = D[dropCursor]; dropCursor = (dropCursor + 1) % MAXD;
  const a = Math.random() * Math.PI * 2, s = (0.6 + Math.random() * 1.4) * power;
  Object.assign(d, { alive: true, x, y, z, vx: Math.sin(a) * s, vz: Math.cos(a) * s,
    vy: 1.0 + Math.random() * 2.0 * power, r: 0.01 + Math.random() * 0.018, life: 2.2, splat: 0 });
}

// ---------------------------------------------------------------- helpers
const TAU = Math.PI * 2;
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const viewK = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect; // half-width per unit depth

// ---------------------------------------------------------------- the electrode array (invisible)
// DishBrain used 8 predefined input electrodes in a "sensory" zone of the array.
// Here they sit under the middle of the dish; every stimulation pulse goes through one (or all) of them.
const INPUT = [];
for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) INPUT.push({ x: -3.3 + c * 2.2, z: -5.2 - r * 3.2 });
const PROTOCOL = {
  unpredictable: { mV: 150, hz: 5, seconds: 4, rest: 4 },  // "miss": random sites, random timing
  predictable: { mV: 75, hz: 100, seconds: 0.1 },          // "hit": all input electrodes in sync
};

// ---------------------------------------------------------------- the culture
const beasts = [];
for (let i = 0; i < N; i++) {
  const z = -rnd(3, 16), x = rnd(-0.85, 0.85) * (0.58 * -z + 0.4);
  const h = rnd(0, TAU);
  beasts.push({
    x, z, y: 0, vy: 0, h, wa: h,
    speed: rnd(0.3, 0.9), vPrev: 0, phase: rnd(0, TAU), amp: 0, knee: 0, land: 0, bounceY: 0, torsoSq: 0,
    yaw: 0, yawV: 0, pitch: 0, pitchV: 0, lean: 0, roll: 0, tilt: 0,
    wobX: 0, wobXv: 0, wobZ: 0, wobZv: 0,
    eye: 0, blink: 1, blinkT: rnd(1, 6), blinkP: -1,
    fire: 0, spiked: false, zap: 0, agit: 0, pending: [],
    glancing: false, glanceT: rnd(1, 6),
    seed: Math.random(), hue: rnd(-1, 1), scale: rnd(0.88, 1.1),
    calmSpeed: rnd(0.6, 1.1), panicSpeed: rnd(3.2, 5.4), sens: rnd(0.75, 1.25), attn: rnd(0.6, 1),
    state: 'walk', stateT: rnd(1, 7), tx: 0, tz: 0,
    startle: 0, dartT: rnd(0.2, 1), n1: rnd(0, 100), n2: rnd(0, 100),
  });
}

const G = { t: 0, stress: 0, memory: 0, held: false, unpredEnd: -1, nextU: 0, predPulses: 0, nextP: 0,
  prevStress: 0, aftermathT: -1 };
const marks = [];   // stimulation pulses waiting to be drawn in the raster

// ---------------------------------------------------------------- sound (only reacts to stimulation)
const audio = (() => {
  let ctx = null, master = null, noise = null, muted = false;
  function init() {
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.25), ctx.sampleRate);
    const ch = noise.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  return {
    // a single unpredictable 150 mV pulse: a dry electric crack
    crack(s = 1) {
      init(); if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime;
      const src = ctx.createBufferSource(); src.buffer = noise;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rnd(1800, 3800); bp.Q.value = 0.9;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.5 * s, t); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.09);
      src.connect(bp).connect(g).connect(master); src.start(t); src.stop(t + 0.12);
      const o = ctx.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(rnd(500, 900), t); o.frequency.exponentialRampToValueAtTime(60, t + 0.08);
      const og = ctx.createGain(); og.gain.setValueAtTime(0.08 * s, t); og.gain.exponentialRampToValueAtTime(0.0005, t + 0.1);
      o.connect(og).connect(master); o.start(t); o.stop(t + 0.12);
    },
    // the predictable 100 Hz / 100 ms train: you can literally hear the 100 Hz
    burst() {
      init(); if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 100;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.004);
      g.gain.setValueAtTime(0.12, t + 0.1); g.gain.linearRampToValueAtTime(0, t + 0.11);
      o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + 0.13);
    },
    toggle() { muted = !muted; if (ctx) master.gain.setTargetAtTime(muted ? 0 : 0.5, ctx.currentTime, 0.02); },
  };
})();

// ---------------------------------------------------------------- stimulation
// one pulse through one electrode: units close to it fire within milliseconds,
// then the evoked activity spreads through the network as a burst
function pulse(e, strength, unpredictable) {
  marks.push(unpredictable ? 'u' : 'p');
  for (const b of beasts) {
    const d = Math.hypot(b.x - e.x, b.z - e.z);
    const direct = strength * Math.exp(-(d * d) / (2.3 * 2.3));
    if (direct > 0.05) {
      b.zap = Math.max(b.zap, Math.min(1, direct * 1.25));
      b.fire = 1; b.spiked = true;
      if (unpredictable) {
        b.agit = Math.min(1, b.agit + 0.5 * direct);
        if (direct > 0.2) {
          if (b.y < 0.02) b.vy = 0.5 + 1.8 * direct;
          b.startle = Math.max(b.startle, 0.08 + 0.16 * direct);
          b.yawV += rnd(-9, 9) * direct; b.pitchV += rnd(-5, 5) * direct;
          b.wobXv += rnd(-9, 9) * direct; b.wobZv += rnd(-9, 9) * direct;
          b.wa += rnd(-1.6, 1.6) * direct;
          if (Math.random() < direct) spawnDrop(b.x, b.y + rnd(0.6, 1.4) * b.scale, b.z, 0.8);
        }
      }
    }
    // network burst: delayed spikes that ripple outwards (~7 units/s)
    if (Math.random() < 0.55 * strength * Math.exp(-d / 9)) {
      b.pending.push(G.t + 0.012 + d / 7 + rnd(0, 0.14));
    }
  }
}

function missFeedback() {                  // SPACE: unpredictable stimulation
  const fresh = G.t >= G.unpredEnd;
  G.unpredEnd = Math.max(G.unpredEnd, G.t + PROTOCOL.unpredictable.seconds);
  if (fresh) {
    G.nextU = 0;                           // first pulse right away
    G.stress = Math.min(1, G.stress + 0.3);
    G.memory = Math.min(1, G.memory + 0.15);
  }
}
function hitFeedback() {                   // P: predictable stimulation
  if (G.predPulses > 0) return;
  G.predPulses = Math.round(PROTOCOL.predictable.hz * PROTOCOL.predictable.seconds);   // 10 pulses
  G.nextP = 0;
  audio.burst();
  for (const b of beasts) {               // one synchronised twitch through the whole culture
    if (b.y < 0.02) b.vy = rnd(0.35, 0.55);
    b.wobXv += rnd(-3, 3); b.wobZv += rnd(-3, 3);
  }
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { G.held = true; missFeedback(); } }
  else if (e.code === 'KeyP' && !e.repeat) hitFeedback();
  else if (e.code === 'KeyM' && !e.repeat) audio.toggle();
});
addEventListener('keyup', e => { if (e.code === 'Space') G.held = false; });
addEventListener('blur', () => { G.held = false; });

// cursor disappears when you stop moving the mouse
let idleTimer = 0;
addEventListener('pointermove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
});
document.body.classList.add('idle');

// ---------------------------------------------------------------- simulation step
const tmp = new THREE.Object3D();

function step(dt) {
  G.t += dt;
  U.uTime.value = G.t;
  const k = viewK();

  // --- stimulation protocols
  const unpred = G.held || G.t < G.unpredEnd;
  if (G.held) G.memory = Math.min(1, G.memory + dt * 0.02);
  if (unpred) {
    G.nextU -= dt;
    while (G.nextU <= 0) {
      pulse(INPUT[(Math.random() * INPUT.length) | 0], PROTOCOL.unpredictable.mV / 150, true);
      G.stress = Math.min(1, G.stress + 0.09);
      audio.crack(rnd(0.6, 1));
      G.nextU += Math.max(0.03, -Math.log(1 - Math.random()) / PROTOCOL.unpredictable.hz); // random timing, ~5 Hz
    }
  } else {
    G.stress *= Math.exp(-dt / 3.0);
  }
  if (G.predPulses > 0) {
    G.nextP -= dt;
    while (G.nextP <= 0 && G.predPulses > 0) {
      for (const e of INPUT) pulse(e, PROTOCOL.predictable.mV / 150, false);
      for (const b of beasts) { b.zap = Math.max(b.zap, 0.4); if (Math.random() < 0.7) { b.fire = 1; b.spiked = true; } }
      G.predPulses--;
      G.nextP += 1 / PROTOCOL.predictable.hz;
      if (G.predPulses === 0) {          // predictable input calms the network down
        G.stress *= 0.55;
        for (const b of beasts) b.agit *= 0.45;
      }
    }
  }
  G.memory = Math.max(0, G.memory - dt * 0.004);     // slowly, they forgive

  // aftermath: when the panic fades, many stop — and some come to the glass to look at you
  if (!unpred && G.prevStress > 0.35 && G.stress <= 0.35) {
    const order = beasts.slice().sort((a, b) => Math.hypot(a.x, a.z) - Math.hypot(b.x, b.z));
    let come = 1 + Math.round(G.memory * 4);
    for (const b of order) {
      if (come > 0 && Math.random() < 0.7) { sendToGlass(b, k); come--; }
      else if (Math.random() < 0.35 + 0.45 * G.memory) { b.state = 'stare'; b.stateT = rnd(2.5, 6.5); }
    }
  }
  G.prevStress = G.stress;

  const atGlass = beasts.filter(b => b.state === 'approach' || b.state === 'glass').length;

  for (let i = 0; i < N; i++) {
    const b = beasts[i];
    b.agit *= Math.exp(-dt / 2.5);
    const sEff = clamp(G.stress * b.sens * 0.85 + b.agit, 0, 1);
    const panic = sEff > 0.3;
    const flee = sEff > 0.5;
    b.startle = Math.max(0, b.startle - dt);

    // delayed (network) spikes
    for (let j = b.pending.length - 1; j >= 0; j--) if (G.t >= b.pending[j]) {
      b.pending.splice(j, 1); b.fire = 1; b.spiked = true;
      if (unpred) b.zap = Math.max(b.zap, 0.15);
    }

    // --- behaviour: walk · stare (stop, face you) · approach → glass (right up against the screen)
    b.stateT -= dt;
    if (flee && b.state !== 'walk') {
      if (b.state === 'glass' || b.state === 'approach') b.wa = Math.atan2(b.x, b.z) + rnd(-0.6, 0.6); // flee from the glass
      b.state = 'walk'; b.stateT = rnd(1, 3);
    }
    const dCam = Math.hypot(b.x, b.z);
    if (b.state === 'walk' && b.stateT <= 0) {
      if (!panic) {
        const r = Math.random(), pStare = 0.18 + 0.3 * G.memory, pGlass = 0.12 + 0.2 * G.memory;
        const maxGlass = 1 + Math.floor(G.memory * 4);
        if (r < pStare) { b.state = 'stare'; b.stateT = rnd(2.5, 6.5); }
        else if (r < pStare + pGlass && atGlass < maxGlass && dCam > 2.5) sendToGlass(b, k);
        else b.stateT = rnd(3, 9);
      } else b.stateT = rnd(1, 3);
    } else if (b.state === 'stare' && b.stateT <= 0) { b.state = 'walk'; b.stateT = rnd(4, 10); }
    else if (b.state === 'glass' && b.stateT <= 0) {
      b.state = 'walk'; b.stateT = rnd(4, 9); b.wa = Math.atan2(b.x, b.z) + rnd(-0.8, 0.8);   // turn and leave
    }

    // --- steering
    const f = panic ? 3.2 : 1;
    b.wa += (Math.sin(G.t * 0.53 * f + b.n1) + 0.6 * Math.sin(G.t * 1.17 * f + b.n2)) * (panic ? 3.2 : 0.6) * dt;
    if (panic) { b.dartT -= dt; if (b.dartT <= 0) { b.dartT = rnd(0.25, 0.9); b.wa += rnd(-1.7, 1.7); } }
    let dx = Math.sin(b.wa), dz = Math.cos(b.wa);
    if (b.state === 'approach') {
      const tx = b.tx - b.x, tz = b.tz - b.z, tl = Math.hypot(tx, tz) || 1;
      dx = tx / tl * 2; dz = tz / tl * 2;
      if (tl < 0.12 || b.stateT <= 0) { b.state = 'glass'; b.stateT = rnd(4, 9) + G.memory * 6; }
    }
    // stay inside the view: soft walls along the edges of the frame and far away in the fog
    const depth = -b.z, half = k * Math.max(depth, 0.3) + 0.3;
    if (Math.abs(b.x) > half * 0.8) dx -= Math.sign(b.x) * ((Math.abs(b.x) - half * 0.8) / (half * 0.2 + 0.2)) ** 2 * 2.5;
    if (depth > 17) dz += ((depth - 17) / 3) ** 2 * 2.5;
    if (depth < 2 && b.state === 'walk' && !panic) dz -= (1 - depth / 2) * 1.6;     // wanderers don't loiter at the glass
    if (depth < 2.8 && panic) dz -= (1 - depth / 2.8) * 4;                     // panic happens out there, not on the glass
    // after many shocks they move more as one: self-organisation
    if (panic && G.memory > 0.05) {
      let ax = 0, az = 0;
      for (const o of beasts) if (o !== b) {
        const ox = o.x - b.x, oz = o.z - b.z;
        if (ox * ox + oz * oz < 9) { ax += Math.sin(o.h); az += Math.cos(o.h); }
      }
      const al = Math.hypot(ax, az);
      if (al > 0) { dx += ax / al * G.memory * 1.4; dz += az / al * G.memory * 1.4; }
    }
    const desired = Math.atan2(dx, dz);
    b.wa += wrapA(desired - b.wa) * Math.min(1, dt * 0.8);

    let targetH = desired;
    const facing = b.state === 'stare' || b.state === 'glass';
    if (facing) targetH = Math.atan2(-b.x, -b.z);      // turn the whole body to you
    const maxTurn = facing ? 1.5 : (panic ? 7 : 1.9);
    const turn = clamp(wrapA(targetH - b.h), -maxTurn * dt, maxTurn * dt);
    b.h = wrapA(b.h + turn);
    const omega = turn / dt;

    // --- speed
    let ts = facing ? 0 : mix(b.calmSpeed * (1 - 0.25 * G.memory) * (b.state === 'approach' ? 1.15 : 1), b.panicSpeed, smooth(0.15, 0.8, sEff));
    if (b.state === 'approach') ts = Math.min(ts, 0.35 + Math.hypot(b.tx - b.x, b.tz - b.z) * 0.8);
    if (b.state === 'glass') {             // creep a little closer while staring
      b.tz = Math.min(-GLASS, b.tz + dt * 0.02);
      const dz2 = b.tz - b.z, dx2 = b.tx - b.x;
      b.x += dx2 * dt * 0.6; b.z += dz2 * dt * 0.6;
    }
    if (b.startle > 0) ts = 0;
    const acc = ts > b.speed ? (panic ? 10 : 1.6) : (panic ? 7 : 2.6);
    b.speed += clamp(ts - b.speed, -acc * dt, acc * dt);
    const accel = (b.speed - b.vPrev) / dt; b.vPrev = b.speed;
    b.x += Math.sin(b.h) * b.speed * dt;
    b.z += Math.cos(b.h) * b.speed * dt;

    // --- hops
    if (b.y > 0 || b.vy > 0) {
      b.vy -= 9.8 * dt; b.y += b.vy * dt;
      if (b.y <= 0) { b.land = Math.min(0.3, -b.vy * 0.075); b.y = 0; b.vy = 0; }
    }
    b.land *= Math.exp(-dt * 9);
    if (panic && b.y <= 0 && b.startle <= 0 && Math.random() < dt * 0.6 * sEff) { b.vy = rnd(1.0, 2.2); b.wobXv += rnd(-6, 6); }

    // --- gait (both pieces of a leg move together)
    const sp = b.speed;
    b.amp = damp(b.amp, sp < 0.06 ? 0 : clamp(0.12 + sp * 0.1, 0, 0.55), 6, dt);
    const stride = 4 * 0.66 * Math.sin(Math.max(b.amp, 0.16));
    b.phase += TAU * clamp(sp / stride, 0, 3.8) * dt;
    b.knee = Math.min(0.95, b.amp * 1.6);
    const cyc = 0.5 - 0.5 * Math.cos(2 * b.phase);
    const gaitOn = smooth(0.03, 0.25, sp);
    b.bounceY = cyc * (0.012 + sp * 0.01) * gaitOn;
    const breathe = (0.5 + 0.5 * Math.sin(G.t * (1.6 + sEff * 6) + b.seed * 9)) * (0.012 + 0.02 * sEff);
    // at the glass they bring their eyes to yours: small ones stretch up to peek in, big ones crouch
    const eyeGap = (1.305 * b.scale - EYE.y) / (0.41 * b.scale);
    b.crouch = damp(b.crouch || 0, b.state === 'glass' ? clamp(eyeGap, -0.28, 0.3) : 0, 1.5, dt);
    b.torsoSq = (1 - cyc) * (0.018 + sp * 0.01) * gaitOn + breathe * (1 - gaitOn) + b.land * 0.5 + b.crouch;

    b.lean = damp(b.lean, clamp(0.03 + sp * 0.04 + accel * 0.02 + (b.state === 'glass' ? 0.06 : 0), -0.15, 0.38), 5, dt);
    b.roll = damp(b.roll, clamp(-omega * sp * 0.05, -0.35, 0.35), 6, dt);

    // --- the stare: they know where you are
    const hy = b.y + 1.25 * b.scale;
    const ddx = EYE.x - b.x, ddy = EYE.y - hy, ddz = EYE.z - b.z;
    const ch = Math.cos(b.h), sh = Math.sin(b.h);
    const lx = ddx * ch - ddz * sh, lz = ddx * sh + ddz * ch;
    let yawT = Math.atan2(lx, lz);
    let pitchT = clamp(-Math.atan2(ddy, Math.hypot(lx, lz)), -0.7, 0.6) - b.lean;
    b.glanceT -= dt;
    if (b.glanceT <= 0) {
      b.glancing = !b.glancing && !panic && Math.random() < (1 - b.attn) * (1 - G.memory) * 1.6;
      b.glanceT = b.glancing ? rnd(0.6, 1.8) : rnd(2, 7);
    }
    if (b.glancing && b.state === 'walk') { yawT = clamp(yawT * 0.12, -0.3, 0.3); pitchT = 0.15; }
    yawT = b.yaw + wrapA(yawT - b.yaw);
    if (Math.abs(yawT) > 3.35) yawT -= Math.sign(yawT) * TAU;   // owl limit: whip back round
    const kS = panic ? 210 : (facing ? 70 : 40), cS = 2 * Math.sqrt(kS) * 0.82;
    b.yawV += (kS * (yawT - b.yaw) - cS * b.yawV) * dt; b.yaw += b.yawV * dt;
    b.pitchV += (kS * (pitchT - b.pitch) - cS * b.pitchV) * dt; b.pitch += b.pitchV * dt;
    if (sEff > 0.4 && Math.random() < dt * 7 * sEff) { b.yawV += rnd(-5, 5); b.pitchV += rnd(-3, 3); }
    // curious head tilt while they study you
    const tiltT = facing ? 0.32 * Math.sin(G.t * 0.55 + b.seed * 20) * (b.state === 'glass' ? 1 : 0.6) : 0;
    b.tilt = damp(b.tilt, tiltT, 2.5, dt);

    // --- jelly antlers
    b.wobXv += (-85 * b.wobX - 3.2 * b.wobXv - accel * 0.05 + Math.sin(2 * b.phase) * sp * 0.35) * dt;
    b.wobZv += (-85 * b.wobZ - 3.2 * b.wobZv + omega * sp * 0.06) * dt;
    b.wobX += b.wobXv * dt; b.wobZ += b.wobZv * dt;

    // --- eyes
    b.eye = damp(b.eye, clamp(sEff * 0.95 + (b.startle > 0 ? 1 : 0) + (facing ? 0.12 : 0) + G.memory * 0.15, 0, 1.25), 9, dt);
    b.blinkT -= dt;
    if (b.blinkT <= 0 && b.blinkP < 0 && sEff < 0.45) { b.blinkP = 0; b.blinkT = rnd(2.5, 7.5); }
    if (b.blinkP >= 0) { b.blinkP += dt / 0.17; b.blink = 1 - Math.sin(Math.min(1, b.blinkP) * Math.PI); if (b.blinkP >= 1) { b.blinkP = -1; b.blink = 1; } }

    // --- spontaneous activity (calm units fire rarely, stressed ones burst)
    const rate = 0.5 + (facing ? 2.0 : 0.8) + 14 * sEff * sEff;
    if (Math.random() < rate * dt) { b.fire = 1; b.spiked = true; }
    b.fire *= Math.exp(-dt / 0.09);
    b.zap *= Math.exp(-dt / 0.09);

    if (sp > 2.5 && Math.random() < dt * sEff * 2.0) spawnDrop(b.x, b.y + rnd(0.6, 1.4) * b.scale, b.z, 0.8);
  }

  // keep them from walking through each other
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const a = beasts[i], b = beasts[j];
    const dx = b.x - a.x, dz = b.z - a.z, d2 = dx * dx + dz * dz, m = 0.6;
    if (d2 < m * m && d2 > 1e-6) {
      const d = Math.sqrt(d2), push = (m - d) * 0.5;
      a.x -= dx / d * push; a.z -= dz / d * push; b.x += dx / d * push; b.z += dz / d * push;
    }
  }
  // ...and from walking through the screen (a panicking one bumps into it)
  for (const b of beasts) {
    if (b.z > -GLASS) {
      if (b.speed > 2 && Math.cos(b.h) > 0.3) {
        b.land = 0.25; b.fire = 1; b.spiked = true; b.speed *= 0.3; b.wa = Math.atan2(b.x, b.z) + rnd(-0.7, 0.7);
      }
      b.z = -GLASS;
    }
  }

  // droplets
  for (let i = 0; i < MAXD; i++) {
    const d = D[i];
    if (!d.alive) { tmp.position.set(0, -50, 0); tmp.scale.setScalar(0); tmp.updateMatrix(); drops.setMatrixAt(i, tmp.matrix); continue; }
    d.life -= dt;
    if (d.y > 0.0) {
      d.vy -= 9.8 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      if (d.z > -0.05) { d.z = -0.05; d.vz = -Math.abs(d.vz) * 0.3; }
      if (d.y <= 0) { d.y = 0; d.splat = 1; }
    }
    if (d.life <= 0) d.alive = false;
    const fade = clamp(d.life / 0.8, 0, 1);
    tmp.position.set(d.x, d.y + d.r * (d.splat ? 0.15 : 1), d.z);
    tmp.rotation.set(0, 0, 0);
    if (d.splat) tmp.scale.set(d.r * 2.2 * fade, d.r * 0.25 * fade, d.r * 2.2 * fade);
    else { const s = Math.min(1.8, 1 + Math.abs(d.vy) * 0.12); tmp.scale.set(d.r / Math.sqrt(s), d.r * s, d.r / Math.sqrt(s)); }
    tmp.updateMatrix(); drops.setMatrixAt(i, tmp.matrix);
  }
  drops.instanceMatrix.needsUpdate = true;
}

function sendToGlass(b, k) {
  const tz = -rnd(GLASS + 0.06, 2.4);
  b.tz = tz;
  b.tx = rnd(-0.5, 0.5) * k * -tz;
  b.state = 'approach'; b.stateT = 18;
}

// push simulation state into GPU buffers
function upload() {
  for (let i = 0; i < N; i++) {
    const b = beasts[i];
    const sEff = clamp(G.stress * b.sens * 0.85 + b.agit, 0, 1);
    const jit = 0.002 + 0.012 * sEff + (b.startle > 0 ? 0.022 : 0);
    tmp.position.set(b.x + rnd(-jit, jit), b.y + b.bounceY, b.z + rnd(-jit, jit));
    tmp.rotation.set(rnd(-jit, jit) * 2.5, b.h, rnd(-jit, jit) * 2.5, 'YXZ');
    const s = b.scale, l = b.land;
    tmp.scale.set(s * (1 + l * 0.55), s * (1 - l), s * (1 + l * 0.55));
    tmp.updateMatrix();
    herd.setMatrixAt(i, tmp.matrix);
    iGait.setXYZW(i, b.phase, b.amp, b.knee, b.torsoSq);
    iLook.setXYZW(i, b.yaw, b.pitch, b.wobX, b.wobZ);
    iBody.setXYZW(i, b.lean + rnd(-jit, jit) * 3, b.roll + rnd(-jit, jit) * 3, b.eye, b.blink);
    iState.setXYZW(i, sEff, b.fire, b.seed, b.hue);
    iFx.setXYZW(i, b.zap, b.tilt, 0, 0);
    FU.uCre.value[i].set(b.x, b.z, 0, b.y);
  }
  herd.instanceMatrix.needsUpdate = true;
  iGait.needsUpdate = iLook.needsUpdate = iBody.needsUpdate = iState.needsUpdate = iFx.needsUpdate = true;
}

// ---------------------------------------------------------------- spike raster (the only thing on screen)
const rc = document.getElementById('raster'), rctx = rc.getContext('2d');
let rdpr = 1, rAcc = 0, pending = [], pendingMarks = [];
function sizeRaster() {
  rdpr = Math.min(devicePixelRatio, 2);
  rc.width = Math.max(1, Math.floor(rc.clientWidth * rdpr));
  rc.height = Math.max(1, Math.floor(rc.clientHeight * rdpr));
}
sizeRaster();
function drawRaster(dt) {
  for (let i = 0; i < N; i++) if (beasts[i].spiked) { pending.push(i); beasts[i].spiked = false; }
  while (marks.length) pendingMarks.push(marks.shift());
  rAcc += dt * 64 * rdpr;
  const shift = Math.floor(rAcc);
  if (shift < 1) return;
  rAcc -= shift;
  const W = rc.width, H = rc.height;
  rctx.globalCompositeOperation = 'copy';
  rctx.drawImage(rc, -shift, 0);
  rctx.globalCompositeOperation = 'source-over';
  const x = W - shift;
  if (pendingMarks.length) {                         // stimulation pulses: full-height ticks
    const u = pendingMarks.includes('u');
    rctx.fillStyle = u ? 'rgba(224,48,95,0.55)' : 'rgba(224,48,95,0.28)';
    rctx.fillRect(x, 0, Math.max(1, rdpr), H);
  }
  const rowH = H / N;
  rctx.fillStyle = G.stress > 0.3 ? '#e0305f' : '#cfc5c9';
  for (const i of pending) rctx.fillRect(x, i * rowH + rowH * 0.12, Math.max(1, rdpr), Math.max(1, rowH * 0.76));
  pending = []; pendingMarks = [];
}

// ---------------------------------------------------------------- loop
let last = performance.now(), frames = 0, perfAcc = 0;
function frame(now) {
  const dt = Math.min(1 / 30, Math.max(1e-4, (now - last) / 1000));
  last = now;
  if (!window.__pause) { step(dt); upload(); }
  if (frames > 30 && frames <= 150) { perfAcc += dt; if (frames === 150 && perfAcc / 120 > 1 / 42 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); } }
  renderer.render(scene, camera);
  drawRaster(dt);
  if (++frames === 3) window.__ready = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizeRaster();
});

// small hook for testing from the console
window.__beest = { G, beasts, camera, missFeedback, hitFeedback, sendToGlass: b => sendToGlass(b, viewK()), drawRaster,
  advance(sec) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) step(1 / 60); upload(); } };
</script>
