<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>presentatie — Inspiratiearchief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" sizes="32x32" href="images/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/icon/favicon-512.png">
<link rel="apple-touch-icon" href="images/icon/favicon-180.png">
<style>
/* Presentatie — in dezelfde stijl als de rest van de site.
   Klik, spatie, → of PageDown: verder. ← of PageUp: terug. F: volledig scherm.
   Bij "zandbak" komt de index achter het woord tevoorschijn; nog één klik en je zit in de site. */

html, body { height: 100%; overflow: hidden; }
body { user-select: none; }

.slide {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(40px, 6vw, 120px) clamp(24px, 8vw, 160px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0s linear 0.35s;
}
.slide.on { opacity: 1; visibility: visible; transition: opacity 0.35s ease; }

.slide-label {
  margin: 0 0 clamp(10px, 1vw, 18px);
  font-size: clamp(11px, 0.85vw, 15px);
  letter-spacing: 0.04em;
}
.slide-title { margin: 0; }
.slide-lines { margin: 0.4em 0 0; padding: 0; list-style: none; font-size: clamp(17px, 1.75vw, 32px); }
/* kop, regels en tekst: allemaal dezelfde letter */
.slide-title,
.slide-lines li,
.slide-text {
  max-width: 40em;
  font-weight: 300;
  font-size: clamp(17px, 1.75vw, 32px);
  line-height: 1.4;
}
.slide-lines li + li { margin-top: 0.4em; }
.slide-text { margin: 0.4em 0 0; }

.slide-num {
  position: fixed;
  z-index: 3;
  right: var(--pad);
  bottom: var(--pad);
  font-size: 11px;
  letter-spacing: 0.04em;
  transition: opacity 0.35s ease;
}

/* zandbak: de letters vliegen het beeld in en veeg je met de cursor weer weg */
.slide.zandbak { pointer-events: none; }
#zand { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.zl {
  position: fixed;
  left: 0;
  top: 0;
  font-weight: 300;
  line-height: 1;
  color: var(--ink);
  white-space: pre;
  will-change: transform;
}

#next {
  position: fixed;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 3s ease;
}
#next.show { opacity: 1; }
#next.live { pointer-events: auto; }
.done .slide, .done .slide-num, .done .corner { opacity: 0 !important; transition: opacity 0.8s ease !important; }
</style>
</head>
<body>

<span class="corner">inspiratiearchief Mick van der Woord</span>
<span class="slide-num"></span>

<script>
/* ---------- De dia's ---------- */
const SLIDES = [
  { label: "terugblik / vooruitblik", title: "Existentieel", lines: [
    "Veel gepraat met makers en klasgenoten",
    "Auteur blijven – zelf keuzes maken" ] },
  { label: "terugblik / vooruitblik", title: "Gesprekjes – Veel interesses (grafisch werk, illustratie, 3d)", lines: [
    "Alles proberen – balans vinden",
    "Opzoek naar nieuwe paden – combinaties – niet stil staan" ] },
  { label: "terugblik / vooruitblik", title: "Workshops – connectie goed", lines: [
    "Onderzoekend – combinaties – digitale + fysieke kwam weer naar voren",
    "Tom putman – specifiek iets in proces – koesteren, tot je zetten" ] },
  { label: "Proces/thema’s", title: "Proces – extreem chaotisch heel breed", lines: [
    "Eindelijk knoop doorgehakt – connectie naar observeren" ] },
  { label: "2 themas", title: "Informatie overschot", text:
    "Wie de informatie bezit wordt gezien als degene die de macht in handen heeft. Maar hoe verhouden we ons als individuen ons tot de immense hoeveelheid informatie die dagelijks op ons wordt afgevuurd? Hoeveel kunnen we aan en hoeveel wordt er precies verwerkt in onze grijze massa? Hoever zitten wij nu in deze accelleratie en komen we in eenzelfde situatie als in de middeleeuwen waar door verbranding informatie werd weggenomen, nu door toe te voegen weg wordt genomen?" },
  { label: "2 themas", title: "Accelleratie", text:
    "Hoe verhoudt de ‘gemaakte wereld’ en de ‘daadwerkelijke wereld’ zich tot elkaar en tot onszelf? Wanneer nemen we een gemaakte wereld eerder voor lief dan een 'echte' wereld?" },
  { word: "zandbak", zandbak: true },
];

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const pad = n => String(n).padStart(3, "0");
const num = document.querySelector(".slide-num");
const LAST = SLIDES.length - 1;

const els = SLIDES.map(s => {
  const el = document.createElement("section");
  el.className = "slide" + (s.zandbak ? " zandbak" : "");
  el.innerHTML = `
    ${s.label ? `<p class="slide-label">${esc(s.label)}</p>` : ""}
    ${s.title ? `<h1 class="slide-title">${esc(s.title)}</h1>` : ""}
    ${s.lines ? `<ul class="slide-lines">${s.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
    ${s.text ? `<p class="slide-text">${esc(s.text)}</p>` : ""}`;
  document.body.appendChild(el);
  return el;
});

/* ---------- De index, die bij "zandbak" achter het woord verschijnt ---------- */
let frame = null;
function prepareNext() {
  if (frame) return;
  frame = document.createElement("iframe");
  frame.id = "next";
  frame.src = "index.html";
  frame.tabIndex = -1;
  frame.setAttribute("aria-hidden", "true");
  document.body.prepend(frame);
  frame.addEventListener("load", () => {
    // links in de index openen als echte pagina
    try {
      frame.contentDocument.addEventListener("click", e => {
        const a = e.target.closest && e.target.closest("a[href]");
        if (!a || a.target === "_blank") return;
        e.preventDefault();
        location.href = a.href;
      }, true);
    } catch (err) { /* lokaal als bestand geopend: links werken dan binnen het frame */ }
  });
}

/* ---------- Bladeren ---------- */
let cur = -1, entered = false;

function show(n) {
  if (entered || n < 0 || n > LAST || n === cur) return;
  if (cur >= 0) els[cur].classList.remove("on");
  cur = n;
  els[cur].classList.add("on");
  num.textContent = `${pad(cur + 1)} / ${pad(SLIDES.length)}`;
  history.replaceState(null, "", "#" + (cur + 1));
  if (cur >= LAST - 1) prepareNext();      // alvast laden, zodat hij klaar is
  if (frame) frame.classList.toggle("show", cur === LAST);
  if (cur === LAST) startZand(SLIDES[LAST].word); else stopZand();
}

/* ---------- Zandbak: letters vliegen in beeld, de cursor veegt ze weg ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
let zand = null; // { layer, letters, raf }

function startZand(word) {
  stopZand();
  // eerst de letter laden, anders kloppen de maten niet
  if (document.fonts && document.fonts.status !== "loaded") {
    document.fonts.ready.then(() => { if (cur === LAST && !zand && !entered) startZand(word); });
    return;
  }
  const layer = document.createElement("div");
  layer.id = "zand";
  document.body.appendChild(layer);

  // lettergrootte: het woord vult bijna de hele breedte
  const probe = document.createElement("span");
  probe.className = "zl";
  probe.style.fontSize = "100px";
  probe.textContent = word;
  layer.appendChild(probe);
  const size = Math.min(100 * innerWidth * 0.9 / probe.getBoundingClientRect().width, innerHeight * 0.62);
  probe.style.fontSize = size + "px";
  const total = probe.getBoundingClientRect();
  probe.remove();

  // elke letter op zijn eigen plek in het woord, gecentreerd
  const spans = [...word].map(ch => {
    const el = document.createElement("span");
    el.className = "zl";
    el.style.fontSize = size + "px";
    el.textContent = ch;
    layer.appendChild(el);
    return el;
  });
  const widths = spans.map(el => el.getBoundingClientRect().width);
  const h = total.height;
  let x = (innerWidth - widths.reduce((a, b) => a + b, 0)) / 2;
  const y = (innerHeight - h) / 2;
  const letters = spans.map((el, i) => {
    const w = widths[i];
    // ergens buiten beeld beginnen
    const a = rand(0, Math.PI * 2), d = Math.hypot(innerWidth, innerHeight) * rand(0.7, 1);
    const L = {
      el, w, h, hx: x, hy: y,
      sx: innerWidth / 2 + Math.cos(a) * d - w / 2, sy: innerHeight / 2 + Math.sin(a) * d - h / 2,
      sr: rand(-540, 540),
      t0: performance.now() + 300 + i * 260, dur: rand(2000, 2800), // rustig binnenzweven
      x: 0, y: 0, rot: 0, vx: 0, vy: 0, vr: 0,
      state: "in", // in → rust → weg → op
    };
    L.x = L.sx; L.y = L.sy; L.rot = L.sr;
    L.el.style.transform = `translate(${L.x}px, ${L.y}px) rotate(${L.rot}deg)`;
    x += w;
    return L;
  });
  zand = { layer, letters, raf: 0, last: performance.now() };
  zand.raf = requestAnimationFrame(zandTick);
}

function stopZand() {
  if (!zand) return;
  cancelAnimationFrame(zand.raf);
  zand.layer.remove();
  zand = null;
}

// landt met een klein naveertje
const easeOutBack = t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function zandTick(now) {
  if (!zand) return;
  const dt = Math.min((now - zand.last) / 16.67, 3);
  zand.last = now;
  let left = 0;
  zand.letters.forEach(L => {
    if (L.state === "in") {
      const p = Math.min(Math.max((now - L.t0) / L.dur, 0), 1), e = easeOutBack(p);
      L.x = L.sx + (L.hx - L.sx) * e;
      L.y = L.sy + (L.hy - L.sy) * e;
      L.rot = L.sr * (1 - e);
      if (p >= 1) { L.state = "rust"; L.x = L.hx; L.y = L.hy; L.rot = 0; }
    } else if (L.state === "weg") {
      L.vy += 0.45 * dt; // zwaartekracht
      L.x += L.vx * dt;
      L.y += L.vy * dt;
      L.rot += L.vr * dt;
      const m = Math.max(L.w, L.h);
      if (L.y > innerHeight + m || L.y < -m * 3 || L.x < -m * 2 || L.x > innerWidth + m) {
        L.state = "op";
        L.el.remove();
      }
    }
    if (L.state !== "op") {
      left++;
      L.el.style.transform = `translate(${L.x}px, ${L.y}px) rotate(${L.rot}deg)`;
    }
  });
  collide(zand.letters);
  if (!left) { stopZand(); enter(); return; }
  zand.raf = requestAnimationFrame(zandTick);
}

// wegvliegende letters botsen op elkaar en op de letters die nog staan
// (elke letter is een cirkel rond zijn midden; staande letters geven niet mee)
function body(L) {
  return { x: L.x + L.w / 2, y: L.y + L.h * 0.55, r: Math.min(L.w, L.h * 0.7) * 0.48 };
}
function collide(letters) {
  const act = letters.filter(L => L.state === "weg" || L.state === "rust");
  for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
    let A = act[i], B = act[j];
    if (A.state === "rust" && B.state === "rust") continue;
    if (A.state === "rust") [A, B] = [B, A]; // A vliegt altijd
    const a = body(A), b = body(B);
    let nx = b.x - a.x, ny = b.y - a.y;
    const d = Math.hypot(nx, ny) || 0.01, overlap = a.r + b.r - d;
    if (overlap <= 0) continue;
    nx /= d; ny /= d;
    const e = 0.85; // hoe stuiterig
    if (B.state === "rust") {
      // tegen een staande letter: terugkaatsen
      A.x -= nx * overlap; A.y -= ny * overlap;
      const vn = A.vx * nx + A.vy * ny;
      if (vn > 0) { A.vx -= (1 + e) * vn * nx; A.vy -= (1 + e) * vn * ny; A.vr = -A.vr * 0.8 + rand(-6, 6); }
    } else {
      // twee vliegende letters: zwaardere letter (groter) duwt harder
      const ma = a.r * a.r, mb = b.r * b.r, tot = ma + mb;
      A.x -= nx * overlap * mb / tot; A.y -= ny * overlap * mb / tot;
      B.x += nx * overlap * ma / tot; B.y += ny * overlap * ma / tot;
      const vn = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
      if (vn < 0) {
        const jimp = -(1 + e) * vn / tot;
        A.vx -= jimp * mb * nx; A.vy -= jimp * mb * ny;
        B.vx += jimp * ma * nx; B.vy += jimp * ma * ny;
        A.vr += rand(-8, 8); B.vr += rand(-8, 8);
      }
    }
  }
}

// een letter wegslaan in de richting van de beweging
function fling(L, dx, dy) {
  const min = 14, sp = Math.hypot(dx, dy);
  // langzaam erover: toch een flinke duw, in dezelfde richting
  if (sp < 0.5) { dx = rand(-5, 5); dy = -min; }
  else if (sp < min) { dx = dx / sp * min; dy = dy / sp * min; }
  L.state = "weg";
  L.vx = Math.max(Math.min(dx * 1.1, 60), -60);
  L.vy = Math.max(Math.min(dy * 1.1 - 6, 60), -60);
  L.vr = rand(-14, 14) + dx * 0.4;
}

// raakt de cursor een letter (een beetje ruim gemeten), dan vliegt hij weg
function hitLetters(px, py, dx, dy) {
  if (!zand) return;
  zand.letters.forEach(L => {
    if (L.state !== "rust") return;
    const padX = L.w * 0.08, top = L.h * 0.18, bottom = L.h * 0.1;
    if (px > L.x - padX && px < L.x + L.w + padX && py > L.y + top && py < L.y + L.h - bottom) fling(L, dx, dy);
  });
}

let lastPX = null, lastPY = null;
addEventListener("pointermove", e => {
  if (lastPX !== null) {
    // tussenpunten, zodat een snelle veeg geen letter overslaat
    const dx = e.clientX - lastPX, dy = e.clientY - lastPY, steps = Math.ceil(Math.hypot(dx, dy) / 20) || 1;
    for (let i = 1; i <= steps; i++) hitLetters(lastPX + dx * i / steps, lastPY + dy * i / steps, dx, dy);
  }
  lastPX = e.clientX; lastPY = e.clientY;
});

// met de afstandsbediening of het toetsenbord: alles in één keer wegblazen
function blowAway() {
  if (!zand) return;
  zand.letters.forEach(L => {
    if (L.state === "op" || L.state === "weg") return;
    L.state = "rust";
    fling(L, rand(-30, 30), rand(-34, -14));
  });
}

// zijn alle letters weg, dan verdwijnt de rest en zit je in de site
function enter() {
  if (entered) return;
  entered = true;
  document.body.classList.add("done");
  frame.classList.add("show", "live");
  frame.removeAttribute("aria-hidden");
  frame.removeAttribute("tabindex");
  setTimeout(() => {
    try {
      document.title = frame.contentDocument.title;
      history.replaceState(null, "", "index.html"); // vernieuwen opent gewoon de index
    } catch (err) { /* lokaal als bestand geopend */ }
    frame.focus();
  }, 800);
}

// op "zandbak" haal je de letters met de cursor weg; verder-toets blaast ze allemaal weg
const forward = () => (cur === LAST ? blowAway() : show(cur + 1));

addEventListener("click", e => {
  if (e.button !== 0) return;
  if (cur === LAST) hitLetters(e.clientX, e.clientY, rand(-20, 20), -20); // klik op een letter: weg
  else forward();
});
addEventListener("keydown", e => {
  if (entered) return;
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); forward(); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(LAST);
  else if (e.key === "f" || e.key === "F") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});

show(Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), LAST));
</script>
</body>
</html>
